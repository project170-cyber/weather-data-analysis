<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Data Analysis</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="main">

<div class="container">

<h1>Weather Data Analysis</h1>

<div class="section">
<h3>Add Temperature Record</h3>

<input type="date" id="date">
<input type="number" id="temp" placeholder="Enter temperature">

<button onclick="addRecord()">Add Record</button>

</div>

<div class="section">
<h3>Search Temperature</h3>

<input type="number" id="searchTemp" placeholder="Enter temperature">
<button onclick="searchTemp()">Search by Temperature</button>

<input type="date" id="searchDate">
<button onclick="searchDate()">Search by Date</button>
</div>

<div class="section">
<h3>Delete Record</h3>

<input type="date" id="deleteDate">
<button onclick="deleteRecord()">Delete Record</button>

</div>

<button class="displayBtn" onclick="displayRecords()">Display All Records</button>

<button onclick="highestTemp()">Show Highest Temperature</button> <button onclick="lowestTemp()">Show Lowest Temperature</button>

</div>

<div class="outputCard">

<h1>Results</h1>

<div id="counter">Total Records: 0</div>

<div id="output">
Output will appear here
</div>

</div>

</div>
<script src="script.js"></script>
</body>
</html>
